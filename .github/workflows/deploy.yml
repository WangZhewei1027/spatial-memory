# Build the production image and roll it out to the Aliyun server on every
# push to main (after the UI quality checks pass).
#
# Mirrors scripts/deploy.sh: buildx (linux/amd64) → docker save | ssh docker
# load → docker compose up. The server keeps its own /opt/spatial-memory/.env, so the
# only secret this workflow needs is an SSH key that can log in as root.
# Production resource identity must already be migrated before deployment.
#
# Repository settings:
#   secrets.DEPLOY_SSH_KEY     private key (ed25519) authorized on the server
#   vars.DEPLOY_HOST           e.g. 139.196.189.102
#   vars.NEXT_PUBLIC_SITE_URL  build-time public URL (inlined into the bundle)
#   vars.NEXT_PUBLIC_MEDIA_BASE_URL
#   vars.NEXT_PUBLIC_TIANDITU_KEY (optional)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ui-quality.yml

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # These large tiles are served from OSS and excluded by .dockerignore.
          sparse-checkout: |
            /*
            !/public/js/viewer/terra_b3dms/
          sparse-checkout-cone-mode: false

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: spatial-memory:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_MEDIA_BASE_URL=${{ vars.NEXT_PUBLIC_MEDIA_BASE_URL }}
            NEXT_PUBLIC_TIANDITU_KEY=${{ vars.NEXT_PUBLIC_TIANDITU_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<EOF
          Host deploy
            HostName $DEPLOY_HOST
            User root
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          EOF

      - name: Check target database migrations (read-only)
        run: |
          set -euo pipefail
          node scripts/db/deployment-check.mjs | ssh deploy \
            "cd /opt/spatial-memory && docker compose exec -T db psql -X -v ON_ERROR_STOP=1 -U spatial_memory -d spatial_memory"

      - name: Ship image and restart
        run: |
          set -euo pipefail
          TAG=${{ github.sha }}
          ssh deploy "test -s /opt/spatial-memory/pgadmin/private/login-password || { echo 'Provision pgAdmin first (docs/pgadmin.md)'; exit 1; }"
          PGADMIN_IMAGE=$(awk '/^  pgadmin:$/ {found=1; next} found && $1=="image:" {print $2; exit}' deploy/docker-compose.yml)
          if ! ssh deploy "docker image inspect '$PGADMIN_IMAGE' >/dev/null 2>&1"; then
            docker pull --platform linux/amd64 "$PGADMIN_IMAGE"
            docker save "$PGADMIN_IMAGE" | gzip -1 | ssh deploy "gunzip | docker load"
          fi
          docker save spatial-memory:$TAG | gzip -1 | ssh deploy "gunzip | docker load"
          ssh deploy "mkdir -p /opt/spatial-memory"
          scp -q deploy/docker-compose.yml deploy/backup.sh deploy:/opt/spatial-memory/
          scp -q deploy/pgadmin/servers.json deploy/pgadmin/provision.py deploy:/opt/spatial-memory/pgadmin/
          scp -q deploy/Caddyfile deploy:/opt/spatial-memory/Caddyfile.domain
          scp -q deploy/Caddyfile.ip deploy:/opt/spatial-memory/Caddyfile.ip
          ssh deploy "cd /opt/spatial-memory && test -f .env || { echo 'missing /opt/spatial-memory/.env on server'; exit 1; }"
          # The server's .env decides which Caddyfile is live (CADDYFILE=Caddyfile
          # for the domain + Let's Encrypt, Caddyfile.ip while ICP filing is pending).
          ssh deploy 'cd /opt/spatial-memory && f=$(grep -E "^CADDYFILE=" .env | cut -d= -f2-); f=${f:-Caddyfile}; [ "$f" = Caddyfile ] && f=Caddyfile.domain; cp "$f" Caddyfile && echo "Caddyfile <- $f"'
          ssh deploy "cd /opt/spatial-memory && docker tag spatial-memory:$TAG spatial-memory:latest && docker compose up -d --wait --wait-timeout 180 --remove-orphans && docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile && docker image prune -f >/dev/null && docker compose ps"

      - name: Smoke test
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL/" || true)
            [ "$code" = "200" ] && { echo "ok ($code)"; exit 0; }
            echo "waiting… ($code)"; sleep 10
          done
          echo "site did not come up"; exit 1
